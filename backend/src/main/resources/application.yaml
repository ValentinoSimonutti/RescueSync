spring:
  application:
    name: rescuesync

  datasource:
    url: jdbc:postgresql://localhost:5433/rescuesync
    username: rescuesync
    password: rescuesync

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Manda el mensaje de error al front (ej: "Podés ofrecer hasta 2"). En Boot 4 ya no es server.error
  web:
    error:
      include-message: always

logging:
  level:
    org.springframework.web: DEBUG

server:
  port: 8081
bonita:
  url: http://localhost:8080/bonita
  process-name: RescueSync
  # Clave que manda Bonita (header X-Api-Key) al pedir las ofertas cuando vence el timer
  integration-key: rescuesync-bonita-2026

sistema-nacional:
  # API desplegada en Render. Para usar la local: SISTEMA_NACIONAL_URL=http://localhost:8090
  url: ${SISTEMA_NACIONAL_URL:https://rescuesync-5qaa.onrender.com}
  # Cuenta de sistema (la misma que usa Bonita)
  usuario: ${SISTEMA_NACIONAL_USUARIO:bonita}
  password: ${SISTEMA_NACIONAL_PASSWORD:bonita123}
