spring:
  application:
    name: rescuesync

  datasource:
    url: jdbc:postgresql://localhost:5433/rescuesync
    username: rescuesync
    password: rescuesync

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081
  error:
    include-message: always   # manda el mensaje de error al front (ej: 401/403 del login)
bonita:
  url: http://localhost:8080/bonita
  process-name: RescueSync

